# Port/Global Settings
logfile_daemon /var/vcap/packages/squid/libexec/log_file_daemon
access_log daemon:/var/vcap/sys/log/squid/access.log
cache_log  /dev/null
pid_filename /var/vcap/sys/run/squid/squid.pid
cache_effective_user  vcap
cache_effective_group vcap
http_port <%= p('squid.port', 3128) %>

<%-
def format_section_lines(lines)
    if lines
        if lines.is_a?(Array)
            aggregated_lines = ""
            lines.each do |line|
                aggregated_lines = aggregated_lines + "\n" + line
            end
            return aggregated_lines
        end
    end
    return lines
end

# Retrieve base and custom sections from the manifest
config_base = p('squid.config_base', {})  # e.g., { "refresh-patterns" => { "order" => 1, "lines" => [] }, ... }
config_custom = p('squid.config_custom', {})  # similar structure, any matching key will extend or override base values

# Merge the two hashes; when there is a conflict, merge the hashes so that the custom takes precedence.
config_merged = config_base.merge(config_custom) do |key, base_val, custom_val|
    base_val.merge(custom_val)  # simple merge: the custom hash keys override the base ones
end

# Sort the merged sections by their 'order' attribute (the lower the order the earlier it appears)
config_sorted = config_merged.sort_by do |key, section|
  order = section['order']
  unless order.is_a?(Integer)
    raise ArgumentError, "Invalid 'order' value for section '#{section_key}': expected an integer, but got #{order.inspect}"
  end
  order
end

# Iterate through the sorted sections
config_sorted.each do |key, section| -%>

<%= "# section["+section['order'].to_s+"]: "+key %>
<%= format_section_lines(section['lines']) %>
<%- end -%>
