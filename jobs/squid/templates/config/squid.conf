logfile_daemon /var/vcap/packages/squid/libexec/log_file_daemon
access_log daemon:/var/vcap/sys/log/squid/access.log
cache_log  /dev/null

pid_filename /var/vcap/sys/run/squid/squid.pid

cache_effective_user  vcap
cache_effective_group vcap

http_port <%= p('port') %>

# On shutdown Squid waits this long for open connections before it exits,
# and it waits the whole time even when idle.  The default of 30 seconds
# outlasts the stop script's 20 second limit.
shutdown_lifetime 10 seconds

refresh_pattern ^ftp:           1440    20%    10080
refresh_pattern -i (/cgi-bin/|\?)  0     0%        0
refresh_pattern .                  0    20%     4320

# The manager, localhost, and CONNECT ACLs are built into Squid.  manager
# matches cache manager requests, which Squid 7 serves only under the
# /squid-internal-mgr/ URL path, since it dropped the cache_object: scheme.
http_access allow manager localhost
http_access deny manager
http_access allow localhost

<%= p('acl') %>

http_access deny all

# never cache
cache deny all
